<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 385" width="100%" style="max-width:880px;height:auto" role="img" aria-label="Before: the right way lives only in prose and the wrong way is shorter, so the agent takes it and you correct it again. After paving with the strongest rung that holds the lesson, from a type down to a one-line rule, the right way is the shortest path and the wrong way bounces off a check that says what to do."><style>
svg { --paper:#fff; --ink:#0a0a0a; --muted:#525252; --accent:#0000ff; --tint:rgba(0,0,255,.05); --fill:rgba(10,10,10,.05); --line:rgba(10,10,10,.3);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif }
@media (prefers-color-scheme: dark) { svg { --paper:#0d0d10; --ink:#f2f2f2; --muted:#a3a3a3; --accent:#8894ff; --tint:rgba(136,148,255,.12); --fill:rgba(255,255,255,.06); --line:rgba(255,255,255,.3) } }
.bg { fill: var(--paper) }
.n { fill: var(--paper); stroke: var(--ink) } .s { fill: var(--fill); stroke: var(--line) }
.f { fill: var(--tint); stroke: var(--accent); stroke-width: 1.2 } .o { fill: var(--paper); stroke: var(--ink); stroke-dasharray: 5 4 }
.t { fill: var(--ink) } .m { fill: var(--muted) } .a { fill: var(--accent) }
.e { stroke: var(--ink); stroke-width: 1.2; fill: none } .ea { stroke: var(--accent); stroke-width: 1.4; fill: none }
.hm { fill: var(--ink) } .ham { fill: var(--accent) }
</style><defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hm"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ham"/></marker>
</defs><rect class="bg" x="0" y="0" width="880" height="385"/><text x="20" y="26" class="t" font-size="13" font-weight="700" text-anchor="start">Before: the wrong way is easier</text><text x="420" y="26" class="a" font-size="13" font-weight="700" text-anchor="start">After paving: the right way is easier</text><rect x="20" y="110" width="80" height="40" rx="6" class="s"/><text x="32" y="134" class="t" font-size="12" font-weight="700" text-anchor="start">Agent</text><path d="M100,130 L130,130 L130,74 L166,74" class="e" stroke-dasharray="4 4" marker-end="url(#h)"/><path d="M100,130 L130,130 L130,186 L166,186" class="e" marker-end="url(#h)"/><rect x="170" y="50" width="210" height="53" rx="6" class="o"/><text x="182" y="74" class="t" font-size="12" font-weight="700" text-anchor="start">Right way</text><text x="182" y="91" class="m" font-size="11" font-weight="400" text-anchor="start">only in prose, easy to miss</text><rect x="170" y="162" width="210" height="53" rx="6" class="n"/><text x="182" y="186" class="t" font-size="12" font-weight="700" text-anchor="start">Wrong way</text><text x="182" y="203" class="m" font-size="11" font-weight="400" text-anchor="start">shorter, so the agent takes it</text><rect x="170" y="240" width="210" height="53" rx="6" class="s"/><text x="182" y="264" class="t" font-size="12" font-weight="700" text-anchor="start">You correct it. Again.</text><text x="182" y="281" class="m" font-size="11" font-weight="400" text-anchor="start">the same mistake comes back</text><path d="M275,210 L275,236" class="e" marker-end="url(#h)"/><rect x="420" y="110" width="80" height="40" rx="6" class="s"/><text x="432" y="134" class="t" font-size="12" font-weight="700" text-anchor="start">Agent</text><path d="M500,130 L530,130 L530,74 L566,74" class="ea" marker-end="url(#ha)"/><path d="M500,130 L530,130 L530,186 L566,186" class="e" stroke-dasharray="4 4" marker-end="url(#h)"/><rect x="570" y="50" width="210" height="53" rx="6" class="f"/><text x="582" y="74" class="a" font-size="12" font-weight="700" text-anchor="start">Right way, paved</text><text x="582" y="91" class="m" font-size="11" font-weight="400" text-anchor="start">now the shortest path</text><rect x="570" y="162" width="210" height="53" rx="6" class="o"/><text x="582" y="186" class="t" font-size="12" font-weight="700" text-anchor="start">Wrong way bounces</text><text x="582" y="203" class="m" font-size="11" font-weight="400" text-anchor="start">the check fails, says what to do</text><path d="M780,186 L804,186 L804,74 L784,74" class="ea" marker-end="url(#ha)"/><text x="812" y="134" class="a" font-size="10" font-weight="700" text-anchor="start">back on</text><text x="812" y="148" class="a" font-size="10" font-weight="700" text-anchor="start">the road</text><rect x="20" y="312" width="840" height="53" rx="6" class="f"/><text x="32" y="336" class="a" font-size="12" font-weight="700" text-anchor="start">Pave with the strongest rung that holds exactly the lesson</text><text x="32" y="353" class="t" font-size="11" font-weight="400" text-anchor="start">Type &gt; Lint &gt; Test &gt; Tool &gt; Helper &gt; Guardrail &gt; Rule. Then delete the prose it replaces.</text></svg>