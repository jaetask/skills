<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 539" width="100%" style="max-width:420px;height:auto" role="img" aria-label="Pave: a repeated correction leads to asking why the wrong path was easier, then picking the strongest rung that holds exactly the lesson, from a type down to a one-line rule, laying it, deleting the prose it replaces, and walking the wrong path once to see it bounce."><style>
svg { --paper:#fff; --ink:#0a0a0a; --muted:#525252; --accent:#0000ff; --tint:rgba(0,0,255,.05); --fill:rgba(10,10,10,.05); --line:rgba(10,10,10,.3);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif }
@media (prefers-color-scheme: dark) { svg { --paper:#0d0d10; --ink:#f2f2f2; --muted:#a3a3a3; --accent:#8894ff; --tint:rgba(136,148,255,.12); --fill:rgba(255,255,255,.06); --line:rgba(255,255,255,.3) } }
.bg { fill: var(--paper) }
.n { fill: var(--paper); stroke: var(--ink) } .s { fill: var(--fill); stroke: var(--line) }
.f { fill: var(--tint); stroke: var(--accent); stroke-width: 1.2 } .o { fill: var(--paper); stroke: var(--ink); stroke-dasharray: 5 4 }
.t { fill: var(--ink) } .m { fill: var(--muted) } .a { fill: var(--accent) }
.e { stroke: var(--ink); stroke-width: 1.2; fill: none } .ea { stroke: var(--accent); stroke-width: 1.4; fill: none }
.hm { fill: var(--ink) } .ham { fill: var(--accent) }
</style><defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hm"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ham"/></marker>
</defs><rect class="bg" x="0" y="0" width="420" height="539"/><text x="20" y="22" class="t" font-size="13" font-weight="700" text-anchor="start">Pave: make the right way the easy way</text><rect x="20" y="40" width="380" height="53" rx="6" class="s"/><text x="32" y="64" class="t" font-size="12" font-weight="700" text-anchor="start">A correction repeats</text><text x="32" y="81" class="m" font-size="11" font-weight="400" text-anchor="start">the same mistake, a second time</text><path d="M210.0,93 L210.0,117" class="e" marker-end="url(#h)"/><rect x="20" y="121" width="380" height="53" rx="6" class="n"/><text x="32" y="145" class="t" font-size="12" font-weight="700" text-anchor="start">Why was the wrong path easier?</text><text x="32" y="162" class="m" font-size="11" font-weight="400" text-anchor="start">a missing type, check, tool or pointer</text><path d="M210.0,174 L210.0,198" class="e" marker-end="url(#h)"/><rect x="20" y="202" width="380" height="155" rx="6" class="f"/><text x="32" y="226" class="a" font-size="12" font-weight="700" text-anchor="start">Pick the strongest rung that holds the lesson</text><text x="32" y="243" class="t" font-size="11" font-weight="400" text-anchor="start">1 Type: the wrong state won&#x27;t compile</text><text x="32" y="260" class="t" font-size="11" font-weight="400" text-anchor="start">2 Lint: an ast-grep rule in .agents/guardrails/rules</text><text x="32" y="277" class="t" font-size="11" font-weight="400" text-anchor="start">3 Test: pin the behaviour</text><text x="32" y="294" class="t" font-size="11" font-weight="400" text-anchor="start">4 Tool: one small CLI for the retyped job</text><text x="32" y="311" class="t" font-size="11" font-weight="400" text-anchor="start">5 Helper: the right way, ready to copy</text><text x="32" y="328" class="t" font-size="11" font-weight="400" text-anchor="start">6 Guardrail: a hook or CI runs the checks</text><text x="32" y="345" class="t" font-size="11" font-weight="400" text-anchor="start">7 Rule: one line, for judgement only</text><path d="M210.0,357 L210.0,381" class="e" marker-end="url(#h)"/><rect x="20" y="385" width="380" height="53" rx="6" class="n"/><text x="32" y="409" class="t" font-size="12" font-weight="700" text-anchor="start">Lay it, then delete the prose it replaces</text><text x="32" y="426" class="m" font-size="11" font-weight="400" text-anchor="start">no rule left that a machine now holds</text><path d="M210.0,438 L210.0,462" class="e" marker-end="url(#h)"/><rect x="20" y="466" width="380" height="53" rx="6" class="f"/><text x="32" y="490" class="a" font-size="12" font-weight="700" text-anchor="start">Walk the wrong path once</text><text x="32" y="507" class="m" font-size="11" font-weight="400" text-anchor="start">it bounces, or the road was never laid</text></svg>